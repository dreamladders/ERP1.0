<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dream Ladders</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f9;
      color: #1f2937;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .brand p {
      color: #6b7280;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    .button {
      width: 100%;
      border: 0;
      padding: 13px;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .switch {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .switch button {
      border: 0;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font-weight: 600;
    }


    /* =========================
       PROTECTED APPLICATION
    ========================= */

    #protectedApp {
      min-height: 100vh;
    }

    .topbar {
      height: 64px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .topbar-title {
      font-size: 19px;
      font-weight: bold;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      font-size: 14px;
    }

    .logout {
      border: 0;
      background: #dc2626;
      color: white;
      padding: 8px 13px;
      border-radius: 7px;
      cursor: pointer;
    }

    .content {
      padding: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .welcome-card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .welcome-card h2 {
      margin-top: 0;
    }

    .profile-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .profile-item {
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
    }

    .profile-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .profile-value {
      font-weight: 600;
      word-break: break-word;
    }


    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-box {
      background: #111827;
      color: white;
      padding: 15px 22px;
      border-radius: 8px;
    }

  </style>
</head>


<body>


<!-- =====================================================
     LOGIN / REGISTER SCREEN
===================================================== -->

<div id="authScreen">

  <div class="login-card">

    <div class="brand">

      <h1>Dream Ladders</h1>

      <p>
        Please login to continue
      </p>

    </div>


    <!-- LOGIN -->

    <form
      id="loginForm"
      onsubmit="login(event)"
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        id="loginButton"
        class="button"
        type="submit"
      >
        Login
      </button>

    </form>


    <!-- REGISTER -->

    <div class="switch">

      Don't have an account?

      <button
        type="button"
        onclick="showRegister()"
      >
        Register
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<!-- =====================================================
     PROTECTED APPLICATION
===================================================== -->

<div
  id="protectedApp"
  class="hidden"
>

  <header class="topbar">

    <div class="topbar-title">
      Dream Ladders ERP
    </div>


    <div class="topbar-right">

      <span
        id="userName"
        class="user-name"
      ></span>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="content">

    <div class="welcome-card">

      <h2>
        Welcome to Dream Ladders
      </h2>

      <p>
        You are successfully authenticated.
      </p>


      <div class="profile-grid">

        <div class="profile-item">

          <div class="profile-label">
            User ID
          </div>

          <div
            id="userId"
            class="profile-value"
          >
            -
          </div>

        </div>


        <div class="profile-item">

          <div class="profile-label">
            Name
          </div>

          <div
            id="profileName"
            class="profile-value"
          >
            -
          </div>

        </div>


        <div class="profile-item">

          <div class="profile-label">
            Email
          </div>

          <div
            id="profileEmail"
            class="profile-value"
          >
            -
          </div>

        </div>


        <div class="profile-item">

          <div class="profile-label">
            Role
          </div>

          <div
            id="profileRole"
            class="profile-value"
          >
            -
          </div>

        </div>


        <div class="profile-item">

          <div class="profile-label">
            Status
          </div>

          <div
            id="profileStatus"
            class="profile-value"
          >
            -
          </div>

        </div>

      </div>

    </div>

  </main>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

  <div class="loading-box">
    Please wait...
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyvsAY2Ux58HfP_KH9wueajN8D53s7oE7hYQiAA2ECPfb515k7Mjdirb9FpQoNF4VoHUQ/exec";


const TOKEN_KEY =
  "dreamLaddersToken";


let currentUser = null;


/* =========================================================
   LOADING
========================================================= */

function setLoading(show) {

  document.getElementById(
    "loading"
  ).style.display =
    show ? "flex" : "none";

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type = "error"
) {

  const element =
    document.getElementById(
      "message"
    );

  element.textContent =
    text;

  element.className =
    "message " + type;

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
  payload
) {

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const text =
      await response.text();


    try {

      return JSON.parse(
        text
      );

    } catch {

      return {
        success: false,
        error:
          "Invalid response from server."
      };

    }

  } catch {

    return {
      success: false,
      error:
        "Unable to connect to server."
    };

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(event) {

  event.preventDefault();


  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  if (!email || !password) {

    showMessage(
      "Email and password are required."
    );

    return;
  }


  setLoading(true);


  const result =
    await apiRequest({

      action:
        "login",

      email:
        email,

      password:
        password

    });


  setLoading(false);


  if (!result.success) {

    showMessage(
      result.error ||
        "Invalid email or password."
    );

    return;
  }


  if (!result.token) {

    showMessage(
      "Login failed: no session token received."
    );

    return;
  }


  /*
   * Save the session token.
   */

  localStorage.setItem(
    TOKEN_KEY,
    result.token
  );


  /*
   * Don't trust the login response alone.
   *
   * Immediately verify the session with
   * the existing backend "me" action.
   */

  await verifySession();

}


/* =========================================================
   VERIFY SESSION
========================================================= */

async function verifySession() {

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if (!token) {

    showLogin();

    return;
  }


  setLoading(true);


  const result =
    await apiRequest({

      action:
        "me",

      token:
        token

    });


  setLoading(false);


  if (
    !result.success ||
    !result.user
  ) {

    localStorage.removeItem(
      TOKEN_KEY
    );

    currentUser = null;

    showLogin();

    return;
  }


  /*
   * Backend confirmed authentication.
   */

  currentUser =
    result.user;


  showProtectedApplication(
    currentUser
  );

}


/* =========================================================
   SHOW PROTECTED APPLICATION
========================================================= */

function showProtectedApplication(
  user
) {

  document
    .getElementById(
      "authScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "protectedApp"
    )
    .classList.remove(
      "hidden"
    );


  document.getElementById(
    "userName"
  ).textContent =
    user.name;


  document.getElementById(
    "userId"
  ).textContent =
    user.userId;


  document.getElementById(
    "profileName"
  ).textContent =
    user.name;


  document.getElementById(
    "profileEmail"
  ).textContent =
    user.email;


  document.getElementById(
    "profileRole"
  ).textContent =
    user.role;


  document.getElementById(
    "profileStatus"
  ).textContent =
    user.status;

}


/* =========================================================
   SHOW LOGIN
========================================================= */

function showLogin() {

  document
    .getElementById(
      "protectedApp"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "authScreen"
    )
    .classList.remove(
      "hidden"
    );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  /*
   * Tell backend to invalidate session.
   */

  if (token) {

    await apiRequest({

      action:
        "logout",

      token:
        token

    });

  }


  /*
   * Remove browser session.
   */

  localStorage.removeItem(
    TOKEN_KEY
  );


  currentUser = null;


  showLogin();

}


/* =========================================================
   REGISTER
========================================================= */

function showRegister() {

  /*
   * For now registration can be added
   * as a separate page/modal using the
   * existing "register" backend action.
   */

  alert(
    "Registration page will be added next."
  );

}


/* =========================================================
   INITIAL PAGE CHECK
========================================================= */

async function initialize() {

  /*
   * IMPORTANT:
   *
   * No protected application is shown
   * until the backend confirms the token.
   */

  const token =
    localStorage.getItem(
      TOKEN_KEY
    );


  if (!token) {

    showLogin();

    return;
  }


  await verifySession();

}


window.addEventListener(
  "DOMContentLoaded",
  initialize
);

</script>

</body>
</html>
