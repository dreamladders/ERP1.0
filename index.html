<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dream Ladders Auth Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      border: 0;
      border-radius: 7px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #666;
    }

    .danger {
      background: #b00020;
    }

    #output {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111;
      color: #00ff88;
      padding: 15px;
      border-radius: 8px;
      min-height: 80px;
      font-family: monospace;
      font-size: 13px;
    }

    .status {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Dream Ladders</h1>

      <p>
        Authentication API Test
      </p>

      <label for="registerName">
        Name
      </label>

      <input
        id="registerName"
        type="text"
        placeholder="Test User"
      >


      <label for="registerEmail">
        Email
      </label>

      <input
        id="registerEmail"
        type="email"
        placeholder="test@example.com"
      >


      <label for="registerPassword">
        Password
      </label>

      <input
        id="registerPassword"
        type="password"
        placeholder="TestUser2026"
      >


      <button
        onclick="registerUser()"
      >
        Register User
      </button>

    </div>


    <div class="card">

      <h2>Login</h2>

      <label for="loginEmail">
        Email
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="test@example.com"
      >


      <label for="loginPassword">
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="TestUser2026"
      >


      <button
        onclick="loginUser()"
      >
        Login
      </button>


      <button
        class="secondary"
        onclick="getCurrentUser()"
      >
        Check My Session
      </button>


      <button
        class="danger"
        onclick="logoutUser()"
      >
        Logout
      </button>

    </div>


    <div class="card">

      <h2>API Response</h2>

      <div id="output">
Waiting...
      </div>

      <div
        id="status"
        class="status"
      ></div>

    </div>

  </div>


<script>

/************************************************************
 * YOUR APPS SCRIPT WEB APP URL
 *
 * IMPORTANT:
 * Paste your NEW working /exec URL here.
 ************************************************************/

const API_URL =
  "YOUR_APPS_SCRIPT_EXEC_URL";


/************************************************************
 * DISPLAY RESULT
 ************************************************************/

function showResult(data) {

  document.getElementById(
    "output"
  ).textContent =
    JSON.stringify(
      data,
      null,
      2
    );

}


/************************************************************
 * DISPLAY STATUS
 ************************************************************/

function showStatus(message) {

  document.getElementById(
    "status"
  ).textContent =
    message;

}


/************************************************************
 * GENERIC API REQUEST
 ************************************************************/

async function apiRequest(
  payload
) {

  showStatus(
    "Sending request..."
  );


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch (error) {

      data = {

        success: false,

        error:
          "Server returned non-JSON response",

        raw:
          text

      };

    }


    showResult(
      data
    );


    if (
      data.success
    ) {

      showStatus(
        "Success"
      );

    } else {

      showStatus(
        "Request failed"
      );

    }


    return data;


  } catch (error) {

    const result = {

      success: false,

      error:
        error.message

    };


    showResult(
      result
    );


    showStatus(
      "Network error"
    );


    return result;
  }
}


/************************************************************
 * REGISTER
 ************************************************************/

async function registerUser() {

  const name =
    document
      .getElementById(
        "registerName"
      )
      .value
      .trim();


  const email =
    document
      .getElementById(
        "registerEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "registerPassword"
      )
      .value;


  if (
    !name ||
    !email ||
    !password
  ) {

    showStatus(
      "Please fill all registration fields."
    );

    return;
  }


  await apiRequest({

    action:
      "register",

    name:
      name,

    email:
      email,

    password:
      password

  });

}


/************************************************************
 * LOGIN
 ************************************************************/

async function loginUser() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  if (
    !email ||
    !password
  ) {

    showStatus(
      "Enter email and password."
    );

    return;
  }


  const data =
    await apiRequest({

      action:
        "login",

      email:
        email,

      password:
        password

    });


  /*
   * Save session token.
   */

  if (
    data &&
    data.success &&
    data.token
  ) {

    localStorage.setItem(

      "dreamLaddersToken",

      data.token

    );


    localStorage.setItem(

      "dreamLaddersUser",

      JSON.stringify(
        data.user
      )

    );


    showStatus(
      "Login successful. Session saved."
    );
  }

}


/************************************************************
 * GET CURRENT USER
 ************************************************************/

async function getCurrentUser() {

  const token =
    localStorage.getItem(
      "dreamLaddersToken"
    );


  if (!token) {

    showStatus(
      "No login session found."
    );

    return;
  }


  await apiRequest({

    action:
      "me",

    token:
      token

  });

}


/************************************************************
 * LOGOUT
 ************************************************************/

async function logoutUser() {

  const token =
    localStorage.getItem(
      "dreamLaddersToken"
    );


  if (!token) {

    showStatus(
      "Already logged out."
    );

    return;
  }


  const data =
    await apiRequest({

      action:
        "logout",

      token:
        token

    });


  if (
    data &&
    data.success
  ) {

    localStorage.removeItem(
      "dreamLaddersToken"
    );


    localStorage.removeItem(
      "dreamLaddersUser"
    );


    showStatus(
      "Logged out."
    );
  }

}


/************************************************************
 * PAGE LOAD
 ************************************************************/

window.addEventListener(
  "DOMContentLoaded",
  function() {

    const token =
      localStorage.getItem(
        "dreamLaddersToken"
      );


    if (token) {

      showStatus(
        "Existing session token found."
      );

    } else {

      showStatus(
        "No active session."
      );

    }

  }
);

</script>

</body>
</html>
